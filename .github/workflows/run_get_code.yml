name: 获取兑换码

on:
  workflow_dispatch:  # 仅手动触发

jobs:
  fetch-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Run get.py
        run: python get.py
